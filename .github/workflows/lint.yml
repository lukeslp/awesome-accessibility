name: Lint

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/scripts/lint-readme.mjs"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install awesome-lint
        run: npm install --no-save --no-package-lock awesome-lint@2.3.0

      - name: Lint README against the Awesome list guidelines
        run: node --no-deprecation .github/scripts/lint-readme.mjs
