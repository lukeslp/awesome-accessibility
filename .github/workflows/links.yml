name: Links

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/lychee.toml"
      - ".github/workflows/links.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
  schedule:
    # Mondays 06:17 UTC: catch links that rot between pull requests.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            --verbose
            README.md CONTRIBUTING.md
          # Report-only on pull requests, so contributors aren't blocked by
          # unrelated sites going down; scheduled and main-branch runs fail.
          fail: ${{ github.event_name != 'pull_request' }}
          jobSummary: true
