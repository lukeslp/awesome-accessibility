name: Links

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/lychee.toml"
      - ".github/workflows/links.yml"
      - ".github/scripts/summarize-links.mjs"
      - ".github/scripts/recheck-timeouts.mjs"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/lychee.toml"
      - ".github/workflows/links.yml"
      - ".github/scripts/summarize-links.mjs"
      - ".github/scripts/recheck-timeouts.mjs"
  schedule:
    # Mondays 06:17 UTC: catch links that rot between pull requests.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config .github/lychee.toml
            --verbose
            README.md CONTRIBUTING.md
          # Preserve the first report, then let the final summary apply the
          # event's failure policy after a limited timeout retry.
          fail: false
          lycheeVersion: v0.24.2
          format: json
          output: lychee/out.json
          jobSummary: false

      - name: Retry timed-out URLs with lower concurrency
        run: node .github/scripts/recheck-timeouts.mjs lychee/out.json lychee/recheck.json

      - name: Report reachable and unverified links separately
        if: always()
        run: node .github/scripts/summarize-links.mjs lychee/out.json lychee/recheck.json
        env:
          FAIL_ON_ERRORS: ${{ github.event_name != 'pull_request' }}
