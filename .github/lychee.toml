# Link checker settings for README.md and CONTRIBUTING.md.
# Docs: https://lychee.cli.rs/usage/config/

max_concurrency = 12
timeout = 30
max_retries = 3
retry_wait_time = 5
max_redirects = 10

# Some sites serve bot checks to the default user agent.
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

# Treat only real success as success, so every failure shows in the report.
accept = ["200..=299"]

# Only check web links.
scheme = ["https", "http"]

exclude_all_private = true
